<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eef2ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#334155" flood-opacity="0.16"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#475569"/>
    </marker>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#2563eb"/>
    </marker>
    <style>
      .title { font: 700 34px "Microsoft JhengHei", "Noto Sans TC", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 17px "Microsoft JhengHei", "Noto Sans TC", sans-serif; fill: #475569; }
      .step { font: 700 22px "Microsoft JhengHei", "Noto Sans TC", sans-serif; fill: #ffffff; }
      .desc { font: 400 15px "Microsoft JhengHei", "Noto Sans TC", sans-serif; fill: #334155; }
      .small { font: 400 14px "Microsoft JhengHei", "Noto Sans TC", sans-serif; fill: #475569; }
      .box { stroke-width: 2; filter: url(#shadow); }
      .arrow { fill: none; stroke: #475569; stroke-width: 3; marker-end: url(#arrow); }
      .loop { fill: none; stroke: #2563eb; stroke-width: 3; stroke-dasharray: 9 7; marker-end: url(#arrowBlue); }
    </style>
  </defs>

  <rect width="1400" height="820" fill="url(#bg)"/>
  <text x="700" y="58" text-anchor="middle" class="title">50 家新創公司利潤分析工作流程</text>
  <text x="700" y="88" text-anchor="middle" class="subtitle">CRISP-DM、五種特徵選擇方法與線性迴歸模型評估</text>

  <path class="arrow" d="M390 220 L505 220"/>
  <path class="arrow" d="M895 220 L1010 220"/>
  <path class="arrow" d="M1205 310 L1205 430"/>
  <path class="arrow" d="M1010 525 L895 525"/>
  <path class="arrow" d="M505 525 L390 525"/>
  <path class="loop" d="M700 620 C700 730,1205 730,1205 620"/>
  <text x="955" y="755" text-anchor="middle" class="small" fill="#2563eb">依評估結果調整特徵與模型</text>

  <g>
    <rect x="105" y="130" width="285" height="180" rx="22" fill="#ffffff" stroke="#2563eb" class="box"/>
    <rect x="105" y="130" width="285" height="55" rx="22" fill="#2563eb"/>
    <rect x="105" y="163" width="285" height="22" fill="#2563eb"/>
    <text x="247" y="166" text-anchor="middle" class="step">1. 商業理解</text>
    <text x="132" y="220" class="desc">• 預測 Profit</text>
    <text x="132" y="250" class="desc">• 找出關鍵獲利特徵</text>
    <text x="132" y="280" class="desc">• 建立可解釋的模型</text>
  </g>

  <g>
    <rect x="505" y="130" width="390" height="180" rx="22" fill="#ffffff" stroke="#0891b2" class="box"/>
    <rect x="505" y="130" width="390" height="55" rx="22" fill="#0891b2"/>
    <rect x="505" y="163" width="390" height="22" fill="#0891b2"/>
    <text x="700" y="166" text-anchor="middle" class="step">2. 資料理解</text>
    <text x="535" y="220" class="desc">• 檢查缺失值、重複值與資料型態</text>
    <text x="535" y="250" class="desc">• 敘述統計、相關係數與州別分析</text>
    <text x="535" y="280" class="desc">• 產生 EDA 圖表與資料品質報告</text>
  </g>

  <g>
    <rect x="1010" y="130" width="285" height="180" rx="22" fill="#ffffff" stroke="#059669" class="box"/>
    <rect x="1010" y="130" width="285" height="55" rx="22" fill="#059669"/>
    <rect x="1010" y="163" width="285" height="22" fill="#059669"/>
    <text x="1152" y="166" text-anchor="middle" class="step">3. 資料準備</text>
    <text x="1037" y="220" class="desc">• State One-Hot Encoding</text>
    <text x="1037" y="250" class="desc">• 80% 訓練 / 20% 測試</text>
    <text x="1037" y="280" class="desc">• 避免資料洩漏</text>
  </g>

  <g>
    <rect x="1010" y="430" width="285" height="190" rx="22" fill="#ffffff" stroke="#7c3aed" class="box"/>
    <rect x="1010" y="430" width="285" height="55" rx="22" fill="#7c3aed"/>
    <rect x="1010" y="463" width="285" height="22" fill="#7c3aed"/>
    <text x="1152" y="466" text-anchor="middle" class="step">4. 模型建立</text>
    <text x="1037" y="520" class="desc">• 五種特徵選擇方法</text>
    <text x="1037" y="550" class="desc">• 建立線性迴歸模型</text>
    <text x="1037" y="580" class="desc">• 五折交叉驗證</text>
  </g>

  <g>
    <rect x="505" y="430" width="390" height="190" rx="22" fill="#ffffff" stroke="#ea580c" class="box"/>
    <rect x="505" y="430" width="390" height="55" rx="22" fill="#ea580c"/>
    <rect x="505" y="463" width="390" height="22" fill="#ea580c"/>
    <text x="700" y="466" text-anchor="middle" class="step">5. 模型評估</text>
    <text x="535" y="520" class="desc">• 比較 MAE、MSE、RMSE、R2 與調整後 R2</text>
    <text x="535" y="550" class="desc">• 最佳模型：Model_3 向後消除法</text>
    <text x="535" y="580" class="desc">• 最佳特徵：R&amp;D Spend</text>
  </g>

  <g>
    <rect x="105" y="430" width="285" height="190" rx="22" fill="#ffffff" stroke="#dc2626" class="box"/>
    <rect x="105" y="430" width="285" height="55" rx="22" fill="#dc2626"/>
    <rect x="105" y="463" width="285" height="22" fill="#dc2626"/>
    <text x="247" y="466" text-anchor="middle" class="step">6. 部署輸出</text>
    <text x="132" y="520" class="desc">• 模型比較與預測 CSV</text>
    <text x="132" y="550" class="desc">• 分析圖表與 JSON 細節</text>
    <text x="132" y="580" class="desc">• README 與分析報告</text>
  </g>

  <g>
    <rect x="60" y="660" width="550" height="105" rx="18" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
    <text x="85" y="692" class="desc" font-weight="700">五種特徵選擇方法</text>
    <text x="85" y="722" class="small">相關係數　•　SelectKBest　•　向後消除法</text>
    <text x="85" y="750" class="small">遞迴特徵消除法（RFE）　•　Lasso</text>
  </g>
</svg>
