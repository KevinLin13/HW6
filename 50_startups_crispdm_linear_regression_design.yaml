    selected_features: "to_be_filled_after_training"
    metrics: "to_be_filled_after_evaluation"

  - model_id: "Model_4"
    feature_selection_method: "Recursive Feature Elimination"
    final_algorithm: "Linear Regression"
    purpose: "透過模型遞迴挑選特徵組合"
    selected_features: "to_be_filled_after_training"
    metrics: "to_be_filled_after_evaluation"

  - model_id: "Model_5"
