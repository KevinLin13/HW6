business_interpretation_rules:
  r_and_d_spend:
    if_selected: "代表在此資料集中，R&D Spend 對 Profit 可能具有較高的線性預測價值。"
    caution: "不能解釋為企業應將所有資源投入研發，也不能直接證明研發支出一定造成獲利上升。"
  marketing_spend:
    if_selected: "可能代表行銷支出對 Profit 有輔助預測效果。"
    if_removed: "不代表行銷不重要，可能只是額外線性解釋力不足或與其他特徵存在重疊。"
  administration:
    if_selected: "可能代表行政管理支出對 Profit 有一定線性預測力。"
    if_removed: "應解釋為在此資料集中，Administration 對 Profit 的直接線性預測力可能較有限，不代表行政管理不重要。"
  state:
    if_selected: "可視為地區環境差異的代理變數。"
    if_removed: "不代表地區因素完全不重要，只代表在此資料與模型設定下額外預測效果有限。"
    caution: "不可推論某州一定比另一州更容易獲利。"

implementation_notes:
  recommended_python_libraries:
    - "pandas"
    - "numpy"
    - "scikit-learn"
    - "statsmodels"
    - "matplotlib"
  sklearn_components:
    preprocessing:
      - "OneHotEncoder"
      - "StandardScaler"
      - "ColumnTransformer"
    model:
      - "LinearRegression"
    feature_selection:
      - "SelectKBest"
      - "f_regression"
      - "RFE"
      - "LassoCV"
    validation:
      - "train_test_split"
      - "KFold"
      - "cross_val_score"
    metrics:
      - "mean_absolute_error"
      - "mean_squared_error"
      - "r2_score"

final_conclusion:
  summary:
    - "本專案以 CRISP-DM 為分析架構。"
    - "建模階段僅使用 Linear Regression。"
    - "透過五種常用特徵篩選方法比較不同特徵組合。"
    - "評估時應同時觀察 MAE、RMSE、R2 與 Adjusted R2。"
    - "模型結果應謹慎解釋，不可過度推論為因果關係。"
  best_practice:
